[package]
name = "tokn-session-viewer"
version.workspace = true
description = "Read-only desktop viewer for agent sessions"
edition.workspace = true
publish = false

[lib]
name = "tokn_session_viewer"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
base64 = "0.22"
dirs.workspace = true
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tokn-session-hub = { path = "../../../crates/hub" }
tokn-viewer-api = { path = "../../../crates/viewer-api" }
zeroize = "1"
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { workspace = true, features = ["process", "fs"] }
tokn-viewer-core.workspace = true
tokn-session-relay.workspace = true
tokn-hub-client-core = { path = "../../../crates/hub-client-core" }
tokn-hub-remote = { path = "../../../crates/hub-remote" }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
