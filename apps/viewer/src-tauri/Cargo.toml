[package]
name = "tokn-session-viewer"
version.workspace = true
description = "Read-only desktop viewer for agent sessions"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "tokn_session_viewer"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
zeroize = "1"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tokio = { workspace = true, features = ["process", "fs"] }
tokn-session-storage.workspace = true
tokn-hub-client-core.workspace = true
tokn-hub-remote.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
axum = "0.8"
base64 = "0.22"
dirs.workspace = true
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tokn-viewer-api = { path = "../../../crates/viewer-api" }
rand = "0.8"
tauri-plugin-opener = "2"
tokio-util = { version = "0.7", features = ["rt"] }
tokn-viewer-core.workspace = true
tokn-session-relay.workspace = true
tokn-session-hub = { path = "../../../crates/hub" }
