map $http_upgrade $tokn_hub_connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=tokn_hub_auth:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=tokn_hub_handshake:1m rate=60r/m;
log_format tokn_hub '$remote_addr [$time_local] "$request_method $uri" '
                     '$status $body_bytes_sent $request_time';

server {
  listen 80;
  listen [::]:80;
  server_name ahub.clouds56.top;

  location ^~ /.well-known/acme-challenge/ {
    root /var/lib/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }

  location / { return 308 https://ahub.clouds56.top$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name ahub.clouds56.top;

  ssl_certificate /etc/letsencrypt/live/ahub.clouds56.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ahub.clouds56.top/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:tokn_hub_tls:1m;
  ssl_session_timeout 10m;

  # Log paths without credential-bearing query strings.
  access_log /var/log/nginx/ahub-access.log tokn_hub;
  error_log /var/log/nginx/ahub-error.log warn;
  client_max_body_size 1m;
  client_header_timeout 15s;
  client_body_timeout 30s;
  limit_req_status 429;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $tokn_hub_connection_upgrade;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  location ^~ /hub/v1/auth/ {
    limit_req zone=tokn_hub_auth burst=20 nodelay;
    proxy_pass http://127.0.0.1:5559;
  }

  location = /hub/v1/tunnel {
    limit_req zone=tokn_hub_handshake burst=20 nodelay;
    proxy_pass http://127.0.0.1:5559;
  }

  location ^~ /hub/v1/secure/ {
    limit_req zone=tokn_hub_handshake burst=20 nodelay;
    proxy_pass http://127.0.0.1:5559;
  }

  location / { proxy_pass http://127.0.0.1:5559; }
}
