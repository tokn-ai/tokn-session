# Initial HTTP-only config for the first certificate issuance.
server {
  listen 80;
  listen [::]:80;
  server_name ahub.clouds56.top;

  location ^~ /.well-known/acme-challenge/ {
    root /var/lib/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }

  location / { return 404; }
}
