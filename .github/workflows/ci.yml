name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_to_store:
        description: Publish the tested applet to Apell Store
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      - name: Build portable Apell guest
        run: cargo build --locked --release --target wasm32-unknown-unknown -p tokn-session-apell

      - name: Test interpreted Apell pairing and delivery
        env:
          TOKN_APELL_TEST_WASM: ${{ github.workspace }}/target/wasm32-unknown-unknown/release/tokn_session_apell.wasm
        run: cargo test --locked --release -p tokn-session-apell --test wasmi -- --ignored

      - name: Build CLI
        run: cargo build -p tokn-session-cli

  viewer:
    name: Session viewer
    # The 26.04 runner's Microsoft apt source can block Firefox dependency setup.
    runs-on: ubuntu-24.04
    outputs:
      apell_artifact_id: ${{ steps.apell_package.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install browser Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache browser Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install WASM bindings CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/viewer/pnpm-lock.yaml

      - name: Check session viewer
        working-directory: apps/viewer
        run: |
          pnpm install --frozen-lockfile
          pnpm run check

      - name: Exercise the session reader in Firefox
        working-directory: apps/viewer
        run: |
          cargo build --locked -p tokn-viewer-api
          pnpm exec playwright install --with-deps firefox
          pnpm run test:browser

      - name: Save mock session screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: session-reader-previews
          path: apps/viewer/test-results/**/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Checkout pinned Apell SDK
        uses: actions/checkout@v4
        with:
          repository: agentic-rs/apell
          ref: 51e17021c5e12839013bd6a098eb1cd18b285d49
          path: .apell-sdk

      - name: Set up Apell CLI
        id: apell_cli
        uses: agentic-rs/apell/actions/setup@actions-v1.0.0

      - name: Build and validate Apell package
        working-directory: apps/viewer
        env:
          APELL_SOURCE: ${{ github.workspace }}/.apell-sdk
          APELL_BIN: ${{ steps.apell_cli.outputs.binary }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: node --import tsx scripts/build-apell.ts

      - name: Stage Store listing files
        run: |
          cp apps/apell/publish.json artifacts/tokn-session.publish.json
          cp apps/apell/public/icon.png artifacts/tokn-session.png

      - name: Save Apell package
        id: apell_package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apell-package
          path: |
            artifacts/tokn-session.apel
            artifacts/tokn-session.sha256
            artifacts/tokn-session.publish.json
            artifacts/tokn-session.png
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  bun-apps:
    name: Bun apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Check Discord pet
        working-directory: apps/discord-pet
        run: |
          bun install --frozen-lockfile
          bun run check

      - name: Check terminal pet
        working-directory: apps/terminal-pet
        run: |
          bun install --frozen-lockfile
          bun run check

      - name: Check pet supervisor
        working-directory: apps/pet
        run: |
          bun install --frozen-lockfile
          bun run check

  codex-ipc:
    name: Codex IPC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Check Codex IPC transport
        working-directory: extensions/codex
        run: |
          bun install --frozen-lockfile
          bun run check

  publish-apell:
    name: Publish Apell nightly
    needs: [rust, viewer, bun-apps, codex-ipc]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: apell-nightly
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download tested Apell package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.viewer.outputs.apell_artifact_id }}
          path: artifacts
          digest-mismatch: error

      - name: Publish nightly package
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types apps/viewer/scripts/publish-apell-nightly.ts

  publish-apell-store:
    name: Publish to Apell Store
    needs: [rust, viewer, bun-apps, codex-ipc]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_to_store
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    concurrency:
      group: apell-store
      cancel-in-progress: false

    steps:
      - name: Download tested Apell package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.viewer.outputs.apell_artifact_id }}
          path: artifacts
          digest-mismatch: error

      - name: Verify package checksum
        working-directory: artifacts
        run: sha256sum --check tokn-session.sha256

      - uses: agentic-rs/apell/actions/publish@actions-v1.0.0
        with:
          store_url: ${{ vars.APELL_STORE_URL }}
          package: artifacts/tokn-session.apel
          metadata: artifacts/tokn-session.publish.json
          icon: artifacts/tokn-session.png
