name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      - name: Build portable Apell guest
        run: cargo build --locked --release --target wasm32-unknown-unknown -p tokn-session-apell

      - name: Test interpreted Apell pairing and delivery
        env:
          TOKN_APELL_TEST_WASM: target/wasm32-unknown-unknown/release/tokn_session_apell.wasm
        run: cargo test --locked -p tokn-session-apell --test wasmi -- --ignored

      - name: Build CLI
        run: cargo build -p tokn-session-cli

  viewer:
    name: Session viewer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install browser Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache browser Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install WASM bindings CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/viewer/pnpm-lock.yaml

      - name: Check session viewer
        working-directory: apps/viewer
        run: |
          pnpm install --frozen-lockfile
          pnpm run check

      - name: Checkout pinned Apell SDK
        uses: actions/checkout@v4
        with:
          repository: agentic-rs/apell
          ref: 270682d1cfd6d9e81dac0076d754a97fb2feaf05
          path: .apell-sdk

      - name: Check Apell entry, manifest and portable backend
        working-directory: apps/viewer
        env:
          APELL_SOURCE: ${{ github.workspace }}/.apell-sdk
        run: node --import tsx scripts/build-apell.ts --check

  bun-apps:
    name: Bun apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Check Discord pet
        working-directory: apps/discord-pet
        run: |
          bun install --frozen-lockfile
          bun run check

      - name: Check terminal pet
        working-directory: apps/terminal-pet
        run: |
          bun install --frozen-lockfile
          bun run check

      - name: Check pet supervisor
        working-directory: apps/pet
        run: |
          bun install --frozen-lockfile
          bun run check

  codex-ipc:
    name: Codex IPC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Check Codex IPC transport
        working-directory: extensions/codex
        run: |
          bun install --frozen-lockfile
          bun run check
