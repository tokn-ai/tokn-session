[package]
name = "tokn-session-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Live agent session feeds over stdout, ZeroMQ, and managed stdio."
license.workspace = true
repository.workspace = true
readme = "README.md"

[[bin]]
name = "tokn-session-relay"
path = "src/main.rs"

[dependencies]
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokn-session-client.workspace = true
tokn-session-codex.workspace = true
tokn-session-core.workspace = true
tokn-session-pi.workspace = true
tokn-session-opencode.workspace = true
tokn-session-dsh.workspace = true
tokn-session-workbuddy.workspace = true
tokn-session-render.workspace = true
zeromq.workspace = true

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
