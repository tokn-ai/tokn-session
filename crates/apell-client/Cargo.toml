[package]
name = "tokn-session-apell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Tokn Session's portable Apell applet backend."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
apell-guest = { git = "https://github.com/agentic-rs/apell", rev = "51e17021c5e12839013bd6a098eb1cd18b285d49" }
tokn-hub-client-core = { path = "../hub-client-core", default-features = false }
serde.workspace = true
serde_json.workspace = true
futures-util = { version = "0.3", features = ["async-await"] }
url = "2"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
tokio.workspace = true
apell-runtime = { git = "https://github.com/agentic-rs/apell", rev = "51e17021c5e12839013bd6a098eb1cd18b285d49" }
tokio-tungstenite = "0.26"
