[package]
name = "tokn-viewer-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared session viewer domain, indexing, history, and live updates."
repository.workspace = true
readme = "README.md"
license.workspace = true

[dependencies]
tokn-interaction-core.workspace = true
tokn-pi-rpc-protocol.workspace = true
tokn-pi-adapter.workspace = true
tokn-codex-adapter.workspace = true
tokn-opencode-adapter.workspace = true
tokn-dsh-adapter.workspace = true
url = "2"
chrono.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tokio = { workspace = true, features = ["process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokn-session-relay.workspace = true
tokn-session-codex.workspace = true
tokn-session-opencode.workspace = true
tokn-session-client.workspace = true
tokn-session-core.workspace = true
tokn-session-index.workspace = true
tokn-session-storage.workspace = true
tokn-session-render.workspace = true
tokn-session-pi.workspace = true
tokn-session-dsh.workspace = true
tokn-session-workbuddy.workspace = true

# Keep the viewer scheduler on FSEvents: recursive Kqueue watches would hold
# one descriptor per historical rollout. Relay retains its Kqueue backend.
[target.'cfg(target_os = "macos")'.dependencies]
notify_fsevent = { package = "notify", version = "7.0.0" }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify.workspace = true

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.26"
tokio = { workspace = true, features = ["test-util"] }
zstd = "0.13"
