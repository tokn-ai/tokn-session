[package]
name = "tokn-codex-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Codex executable discovery and app-server runtime adapter."

[features]
default = ["app-server"]
app-server = [
  "dep:tokn-interaction-core",
  "dep:tokn-codex-rpc-protocol",
  "dep:serde_json",
  "dep:tokio",
  "dep:uuid",
  "dep:sha2",
  "dep:base64",
  "dep:futures-util",
  "dep:tokio-tungstenite",
]

[dependencies]
tokn-session-storage.workspace = true
tokn-interaction-core = { workspace = true, optional = true }
tokn-codex-rpc-protocol = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["process"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
futures-util = { version = "0.3", optional = true }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
dirs.workspace = true

[dev-dependencies]
tempfile = "3"
